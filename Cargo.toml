[package]
name = "oxide-rf"
version = "0.3.2-beta"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
ui-screenshot = []

[lib]
name = "vhs_opencl"
crate-type = ["cdylib", "rlib"]

[dependencies]
ocl = "0.19"
eframe = "0.31"
rfd = "0.15"
serde_json = "1"
claxon = "0.4"
cpal = "0.18"
ctrlc = { version = "3.5", features = ["termination"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustfft = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_SystemInformation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
