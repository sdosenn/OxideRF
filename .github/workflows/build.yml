# Builds, tests and lints Oxide RF on Linux, Windows and macOS when a release
# is published, and attaches the builds to that release. Can also be started
# by hand from the Actions tab.
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install ALSA and OpenCL development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev ocl-icd-opencl-dev

      # GPU drivers ship OpenCL.dll only; linking needs the OpenCL.lib import library.
      - name: Install the OpenCL ICD loader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opencl:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "OPENCL_LIB_DIR=$root\lib" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - uses: actions/upload-artifact@v4
        with:
          name: oxide-rf-${{ runner.os }}
          path: |
            target/release/oxide-rf
            target/release/oxide-rf.exe
          if-no-files-found: error

      - name: Package the macOS app bundle
        if: runner.os == 'macOS'
        run: scripts/build-macos-app.sh

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: oxide-rf-macOS-app
          path: dist/Oxide-RF-*-macOS.zip
          if-no-files-found: error

      - name: Attach the build to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RUNNER_OS" in
            Linux) cp target/release/oxide-rf "oxide-rf-$TAG-linux-x86_64"; asset="oxide-rf-$TAG-linux-x86_64" ;;
            Windows) cp target/release/oxide-rf.exe "oxide-rf-$TAG-windows-x86_64.exe"; asset="oxide-rf-$TAG-windows-x86_64.exe" ;;
            macOS) asset=dist/Oxide-RF-*-macOS.zip ;;
          esac
          gh release upload "$TAG" $asset --clobber
